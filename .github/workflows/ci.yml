name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src/aacc
      - name: Test
        run: uv run pytest --cov=src/aacc --cov-report=xml -q
      - name: Changed-line coverage
        if: matrix.os == 'macos-latest'
        run: uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90
      - name: Dependency vulnerability scan
        run: |
          uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file pip-audit-requirements.txt
          uv run pip-audit --requirement pip-audit-requirements.txt --no-deps --disable-pip --format=json --output=pip-audit-${{ matrix.os }}.json
          uv run python -c "from pathlib import Path; assert Path('pip-audit-${{ matrix.os }}.json').stat().st_size > 0"
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-${{ matrix.os }}
          path: pip-audit-${{ matrix.os }}.json
          if-no-files-found: error
      - name: Build macOS app
        if: matrix.os == 'macos-latest'
        run: scripts/build_app.sh
      - name: Assert macOS app
        if: matrix.os == 'macos-latest'
        run: test -d dist/AACC.app
      - name: Build Windows app
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Assert Windows executable and modules
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AACC\AACC.exe")) { throw "AACC.exe missing" }
          $listing = (uv run pyi-archive_viewer -r "dist\AACC\AACC.exe" | Out-String)
          foreach ($module in @("aacc.win32", "aacc.automation_windows", "aacc.hotkeys_windows")) {
            if ($listing -notmatch [regex]::Escape($module)) { throw "$module missing" }
          }
      - name: Package Windows portable app
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = uv version --short
          $archive = "AACC-$version-windows-x64.zip"
          Compress-Archive -Path "dist\AACC" -DestinationPath $archive -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead($archive).Entries.FullName
          if ($entries -notcontains "AACC/AACC.exe") { throw "AACC.exe missing from $archive" }
      - name: Upload Windows portable package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: AACC-windows-x64
          path: AACC-*-windows-x64.zip
          if-no-files-found: error
