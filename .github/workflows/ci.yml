name: CI

on: [push, pull_request]

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src/aacc
      - name: Test
        run: uv run pytest --cov=src/aacc --cov-report=xml -q
      - name: Changed-line coverage
        if: matrix.os == 'macos-latest'
        run: uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90
      - name: Dependency vulnerability scan
        run: |
          uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file pip-audit-requirements.txt
          uv run pip-audit --requirement pip-audit-requirements.txt --no-deps --disable-pip --format=json --output=pip-audit-${{ matrix.os }}.json
          uv run python -c "from pathlib import Path; assert Path('pip-audit-${{ matrix.os }}.json').stat().st_size > 0"
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-${{ matrix.os }}
          path: pip-audit-${{ matrix.os }}.json
          if-no-files-found: error
      - name: Build macOS app
        if: matrix.os == 'macos-latest'
        run: scripts/build_app.sh
      - name: Assert macOS app
        if: matrix.os == 'macos-latest'
        run: test -d dist/AACC.app

  windows-package:
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Build Windows app without Setup
        if: matrix.os == 'windows-2022'
        shell: pwsh
        env:
          AACC_SKIP_INSTALLER: 1
        run: ./scripts/build_windows.ps1
      - name: Build Windows app and Setup
        if: matrix.os == 'windows-2025-vs2026'
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Assert Windows executable and modules
        if: startsWith(matrix.os, 'windows-')
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist\AACC\AACC.exe" -PathType Leaf)) { throw "AACC.exe missing" }
          if (-not (Test-Path -LiteralPath "dist\AACC\aacc-spawn.exe" -PathType Leaf)) { throw "aacc-spawn.exe missing" }
          $listing = (uv run pyi-archive_viewer -r "dist\AACC\AACC.exe" | Out-String)
          foreach ($module in @("aacc.win32", "aacc.automation_windows", "aacc.hotkeys_windows", "aacc.windows_broker")) {
            if ($listing -notmatch [regex]::Escape($module)) { throw "$module missing" }
          }
      - name: Smoke frozen Windows product
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: ./scripts/test_windows_package.ps1 -FrozenOnly
      - name: Smoke frozen and installed Windows product
        if: matrix.os == 'windows-2025-vs2026'
        shell: pwsh
        run: ./scripts/test_windows_package.ps1
      - name: Package verified Windows portable app
        shell: pwsh
        run: |
          $version = uv version --short
          $archive = "AACC-$version-windows-x64-${{ matrix.os }}.zip"
          Compress-Archive -Path "dist\AACC" -DestinationPath $archive -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead($archive).Entries.FullName
          if ($entries -notcontains "AACC/AACC.exe") { throw "AACC.exe missing from $archive" }
      - name: Stage verified Windows outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "build\verified-output\dist" -Force | Out-Null
          Copy-Item -LiteralPath "dist\AACC" -Destination "build\verified-output\dist" -Recurse
          Copy-Item -Path "AACC-*-windows-x64-${{ matrix.os }}.zip" -Destination "build\verified-output"
          if ("${{ matrix.os }}" -eq "windows-2025-vs2026") {
            Copy-Item -Path "dist\installer\AACC-*-Setup.exe" -Destination "build\verified-output"
            Copy-Item -Path "dist\installer\AACC-*-Setup.exe.sha256" -Destination "build\verified-output"
          }
      - name: Upload verified matrix output
        uses: actions/upload-artifact@v4
        with:
          name: windows-verified-${{ matrix.os }}
          path: build/verified-output
          if-no-files-found: error
      - name: Upload Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-${{ matrix.os }}
          path: |
            build/windows-smoke
            build/native/*.txt
            dist/installer/*.log
          if-no-files-found: warn

  publish-windows-artifacts:
    needs: [windows-package]
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Download verified Windows Server output
        uses: actions/download-artifact@v4
        with:
          name: windows-verified-windows-2025-vs2026
          path: verified
      - name: Revalidate checksum, ZIP layout, and onedir hashes
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -LiteralPath "verified" -Filter "AACC-*-Setup.exe" -File)
          $checksum = @(Get-ChildItem -LiteralPath "verified" -Filter "AACC-*-Setup.exe.sha256" -File)
          $portable = @(Get-ChildItem -LiteralPath "verified" -Filter "AACC-*-windows-x64-windows-2025-vs2026.zip" -File)
          if ($setup.Count -ne 1 -or $checksum.Count -ne 1 -or $portable.Count -ne 1) {
            throw "verified primary artifact set is incomplete"
          }
          uv run python scripts/verify_windows_artifacts.py `
            --setup $setup[0].FullName `
            --checksum $checksum[0].FullName `
            --portable $portable[0].FullName `
            --built-root "verified\dist\AACC"
          Write-Host "Hosted Windows Server evidence only; consumer Windows 10/11 not claimed"
      - name: Upload primary Windows Setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AACC-Windows-Setup
          path: |
            verified/AACC-*-Setup.exe
            verified/AACC-*-Setup.exe.sha256
            verified/AACC-*-windows-x64-windows-2025-vs2026.zip
          if-no-files-found: error
