name: CI

on: [push, pull_request]

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src/aacc
      - name: Test
        run: uv run pytest --cov=src/aacc --cov-report=xml -q
      - name: Changed-line coverage
        if: matrix.os == 'macos-latest'
        run: uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90
      - name: Dependency vulnerability scan
        run: |
          uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file pip-audit-requirements.txt
          uv run pip-audit --requirement pip-audit-requirements.txt --no-deps --disable-pip --format=json --output=pip-audit-${{ matrix.os }}.json
          uv run python -c "from pathlib import Path; assert Path('pip-audit-${{ matrix.os }}.json').stat().st_size > 0"
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-${{ matrix.os }}
          path: pip-audit-${{ matrix.os }}.json
          if-no-files-found: error
      - name: Build macOS app
        if: matrix.os == 'macos-latest'
        run: scripts/build_app.sh
      - name: Assert macOS app
        if: matrix.os == 'macos-latest'
        run: test -d dist/AACC.app

  windows-frozen-2022:
    needs: [quality]
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Build Windows app without Setup
        shell: powershell
        env:
          AACC_SKIP_INSTALLER: 1
        run: ./scripts/build_windows.ps1
      - name: Assert Windows executable and modules
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath "dist\AACC\AACC.exe" -PathType Leaf)) { throw "AACC.exe missing" }
          if (-not (Test-Path -LiteralPath "dist\AACC\aacc-spawn.exe" -PathType Leaf)) { throw "aacc-spawn.exe missing" }
          $listing = (uv run pyi-archive_viewer -r "dist\AACC\AACC.exe" | Out-String)
          foreach ($module in @("aacc.win32", "aacc.automation_windows", "aacc.hotkeys_windows", "aacc.windows_broker", "aacc.kimi_edge_cdp", "aacc.kimi_edge_session", "aacc.kimi_membership_query", "websocket")) {
            if ($listing -notmatch [regex]::Escape($module)) { throw "$module missing" }
          }
          $eventModules = @(Get-ChildItem -LiteralPath "dist\AACC" -Recurse -File -Filter "win32event*.pyd")
          if ($eventModules.Count -ne 1) { throw "Expected exactly one win32event extension module" }
          if ($eventModules[0].Length -le 0) { throw "win32event extension module is empty" }
      - name: Smoke frozen Windows product
        shell: powershell
        run: ./scripts/test_windows_package.ps1 -FrozenOnly
      - name: Upload Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-windows-2022
          path: |
            build/windows-smoke
            build/native/*.txt
          if-no-files-found: warn

  windows-package-2025:
    needs: [quality, windows-frozen-2022]
    runs-on: windows-2025-vs2026
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Build Windows app and Setup
        shell: powershell
        run: ./scripts/build_windows.ps1
      - name: Assert Windows executable and modules
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath "dist\AACC\AACC.exe" -PathType Leaf)) { throw "AACC.exe missing" }
          if (-not (Test-Path -LiteralPath "dist\AACC\aacc-spawn.exe" -PathType Leaf)) { throw "aacc-spawn.exe missing" }
          $listing = (uv run pyi-archive_viewer -r "dist\AACC\AACC.exe" | Out-String)
          foreach ($module in @("aacc.win32", "aacc.automation_windows", "aacc.hotkeys_windows", "aacc.windows_broker", "aacc.kimi_edge_cdp", "aacc.kimi_edge_session", "aacc.kimi_membership_query", "websocket")) {
            if ($listing -notmatch [regex]::Escape($module)) { throw "$module missing" }
          }
          $eventModules = @(Get-ChildItem -LiteralPath "dist\AACC" -Recurse -File -Filter "win32event*.pyd")
          if ($eventModules.Count -ne 1) { throw "Expected exactly one win32event extension module" }
          if ($eventModules[0].Length -le 0) { throw "win32event extension module is empty" }
      - name: Smoke frozen and installed Windows product
        shell: powershell
        run: ./scripts/test_windows_package.ps1
      - name: Package and strictly verify primary artifacts
        shell: powershell
        run: |
          $version = uv version --short
          $artifactRoot = "build\candidate-validation\artifact 验证 &() %! [x]"
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $portablePath = Join-Path $artifactRoot "AACC-$version-windows-x64-windows-2025-vs2026.zip"
          $portableBuildPath = Join-Path "build\candidate-validation" "AACC-$version-windows-x64-windows-2025-vs2026.zip"
          Compress-Archive -LiteralPath "dist\AACC" -DestinationPath $portableBuildPath -Force
          Copy-Item -LiteralPath $portableBuildPath -Destination $portablePath
          Copy-Item -LiteralPath "dist\installer\AACC-$version-Setup.exe" -Destination $artifactRoot
          Copy-Item -LiteralPath "dist\installer\AACC-$version-Setup.exe.sha256" -Destination $artifactRoot
          $setup = @(Get-ChildItem -LiteralPath $artifactRoot -Filter "AACC-*-Setup.exe" -File)
          $checksum = @(Get-ChildItem -LiteralPath $artifactRoot -Filter "AACC-*-Setup.exe.sha256" -File)
          $portable = @(Get-ChildItem -LiteralPath $artifactRoot -Filter "AACC-*-windows-x64-windows-2025-vs2026.zip" -File)
          if ($setup.Count -ne 1 -or $checksum.Count -ne 1 -or $portable.Count -ne 1) {
            throw "verified primary artifact set is incomplete"
          }
          uv run python scripts/verify_windows_artifacts.py `
            --setup $setup[0].FullName `
            --checksum $checksum[0].FullName `
            --portable $portable[0].FullName `
            --built-root "dist\AACC"
          New-Item -ItemType Directory -Path "build\verified-output" -Force | Out-Null
          Copy-Item -LiteralPath $setup[0].FullName -Destination "build\verified-output"
          Copy-Item -LiteralPath $checksum[0].FullName -Destination "build\verified-output"
          Copy-Item -LiteralPath $portable[0].FullName -Destination "build\verified-output"
          Write-Host "Hosted Windows Server evidence only; consumer Windows 10/11 not claimed"
      - name: Upload primary Windows Setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AACC-Windows-Setup
          path: |
            build/verified-output/AACC-*-Setup.exe
            build/verified-output/AACC-*-Setup.exe.sha256
            build/verified-output/AACC-*-windows-x64-windows-2025-vs2026.zip
          if-no-files-found: error
      - name: Upload Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-windows-2025-vs2026
          path: |
            build/windows-smoke
            build/native/*.txt
            dist/installer/*.log
          if-no-files-found: warn
