name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src/aacc
      - name: Test
        run: QT_QPA_PLATFORM=offscreen uv run pytest --cov=src/aacc --cov-report=xml -q
      - name: Changed-line coverage
        run: uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90
      - name: Dependency vulnerability scan
        run: |
          uv export --locked --extra dev --no-emit-project \
            --format requirements-txt --output-file pip-audit-requirements.txt
          uv run pip-audit --requirement pip-audit-requirements.txt \
            --no-deps --disable-pip --format=json --output=pip-audit.json
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
